<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boopersnooter and Woowoo world</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #0f172a;
        color: #f8fafc;
      }

      header {
        text-align: center;
        padding: 2.5rem 1rem 1.5rem;
      }

      h1 {
        font-size: clamp(2rem, 5vw, 3rem);
        margin: 0 0 0.5rem;
      }

      header p {
        opacity: 0.7;
      }

      /* The subtitle stays optically centred in the header while the controls
         sit hard left, so the row is relative + absolutely-placed controls
         rather than a flex row (which would push the subtitle off-centre). */
      .subtitle-row {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Tall enough for the 30px buttons, so they don't hang out of the row
           into the heading's margin. */
        min-height: 34px;
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 1rem;
      }

      .subtitle-row p {
        margin: 0;
      }

      .controls {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        gap: 6px;
        /* #subtitle is opacity < 1, which gives it its own stacking context
           painted at z-index 0 — later in DOM order, so without this it covers
           the buttons and swallows their clicks. */
        z-index: 1;
      }

      .controls button {
        all: unset;
        cursor: pointer;
        position: relative;
        width: 30px;
        height: 30px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        color: #f8fafc;
        opacity: 0.45;
        background: rgba(248, 250, 252, 0.06);
        transition: opacity 0.15s ease, background 0.15s ease;
      }

      /* Hover/focus hint. Native title= works but waits about a second and
         can't be seen from the keyboard; this shows straight away. */
      .controls button::after {
        content: attr(data-tip);
        position: absolute;
        top: calc(100% + 8px);
        left: 0;
        z-index: 2;
        white-space: nowrap;
        font-size: 0.75rem;
        line-height: 1;
        padding: 6px 9px;
        border-radius: 6px;
        background: #1e293b;
        color: #f8fafc;
        box-shadow: 0 4px 12px rgba(2, 6, 23, 0.5);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s ease;
      }

      .controls button:hover::after,
      .controls button:focus-visible::after {
        opacity: 1;
      }

      .controls button:hover {
        opacity: 0.8;
      }

      .controls button:focus-visible {
        outline: 2px solid #38bdf8;
        outline-offset: 2px;
      }

      .controls button.on {
        opacity: 1;
        background: rgba(56, 189, 248, 0.3);
      }

      .controls svg {
        width: 17px;
        height: 17px;
      }

      @media (max-width: 640px) {
        /* No room to overlap on a phone — let the controls take their own line. */
        .subtitle-row {
          display: block;
        }

        .controls {
          position: static;
          transform: none;
          margin: 0 0 0.75rem;
        }
      }

      main {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 1rem 3rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 8px;
      }

      .grid button {
        all: unset;
        cursor: zoom-in;
        position: relative;
        aspect-ratio: 1 / 1;
        overflow: hidden;
        border-radius: 8px;
        background: #1e293b;
        display: block;
      }

      .grid img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.2s ease;
      }

      .grid button:hover img,
      .grid button:focus-visible img {
        transform: scale(1.05);
      }

      .grid button:focus-visible {
        outline: 2px solid #38bdf8;
        outline-offset: 2px;
      }

      .grid video.preview {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s ease;
      }

      .grid button.video-hovering video.preview {
        opacity: 1;
      }

      .grid button.video-hovering img {
        opacity: 0;
      }

      .play-badge {
        position: absolute;
        bottom: 6px;
        right: 6px;
        width: 26px;
        height: 26px;
        border-radius: 999px;
        background: rgba(2, 6, 23, 0.65);
        display: grid;
        place-items: center;
        pointer-events: none;
      }

      .play-badge::after {
        content: "";
        border-style: solid;
        border-width: 6px 0 6px 10px;
        border-color: transparent transparent transparent #f8fafc;
        margin-left: 2px;
      }

      .empty {
        text-align: center;
        opacity: 0.7;
        padding: 3rem 1rem;
      }

      .pager {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem 1rem 0.5rem;
      }

      .pager[hidden] {
        display: none;
      }

      .pager button {
        all: unset;
        cursor: pointer;
        padding: 0.5rem 1rem;
        border-radius: 999px;
        background: rgba(248, 250, 252, 0.08);
        color: #f8fafc;
        font-size: 0.9rem;
        transition: background 0.15s ease;
      }

      .pager button:hover {
        background: rgba(56, 189, 248, 0.3);
      }

      .pager button:focus-visible {
        outline: 2px solid #38bdf8;
        outline-offset: 2px;
      }

      .pager button:disabled {
        cursor: default;
        opacity: 0.3;
        background: rgba(248, 250, 252, 0.08);
      }

      /* Lightbox */
      dialog#lightbox {
        border: none;
        padding: 0;
        margin: auto;
        max-width: 100vw;
        max-height: 100vh;
        width: 100%;
        height: 100%;
        background: rgba(2, 6, 23, 0.96);
        color: #f8fafc;
      }

      dialog#lightbox::backdrop {
        background: rgba(2, 6, 23, 0.96);
      }

      .lightbox-inner {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .lightbox-inner img,
      .lightbox-inner video {
        max-width: 92vw;
        max-height: 88vh;
        object-fit: contain;
        border-radius: 4px;
      }

      .lightbox-inner button {
        all: unset;
        cursor: pointer;
        position: absolute;
        color: #f8fafc;
        background: rgba(15, 23, 42, 0.6);
        border-radius: 999px;
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        font-size: 1.4rem;
        line-height: 1;
        user-select: none;
      }

      .lightbox-inner button:hover,
      .lightbox-inner button:focus-visible {
        background: rgba(56, 189, 248, 0.35);
      }

      /* Used for the prev/next arrows at the very start and end of the gallery.
         visibility (not display) so the arrow that remains doesn't shift. */
      .lightbox-inner button.is-hidden {
        visibility: hidden;
        pointer-events: none;
      }

      #closeBtn {
        top: 16px;
        right: 16px;
      }

      #prevBtn {
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
      }

      #nextBtn {
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
      }

      #counter {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.85rem;
        opacity: 0.8;
        background: rgba(15, 23, 42, 0.6);
        padding: 4px 12px;
        border-radius: 999px;
      }

      @media (max-width: 640px) {
        .lightbox-inner button {
          width: 38px;
          height: 38px;
          font-size: 1.2rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Boopersnooter and Woowoo world</h1>
      <div class="subtitle-row">
        <div class="controls">
          <button id="shuffleBtn" type="button" aria-pressed="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M16 3h5v5" /><path d="M4 20 21 3" />
              <path d="M21 16v5h-5" /><path d="m15 15 6 6" /><path d="m4 4 5 5" />
            </svg>
          </button>
          <button id="filterBtn" type="button">
            <svg id="filterIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
          </button>
        </div>
        <p id="subtitle">Loading gallery&hellip;</p>
      </div>
      <p id="love">We love you puppies, you're the best</p>
    </header>
    <main>
      <div class="grid" id="grid"></div>
      <nav class="pager" id="pager" hidden>
        <button id="pagePrev" type="button">&#8249; Previous</button>
        <button id="pageNext" type="button">Next &#8250;</button>
      </nav>
    </main>

    <dialog id="lightbox">
      <div class="lightbox-inner">
        <button id="closeBtn" aria-label="Close">&times;</button>
        <button id="prevBtn" aria-label="Previous photo">&#8249;</button>
        <img id="lightboxImg" src="" alt="" />
        <video id="lightboxVideo" controls playsinline style="display: none"></video>
        <button id="nextBtn" aria-label="Next photo">&#8250;</button>
        <span id="counter"></span>
      </div>
    </dialog>

    <script>
      const grid = document.getElementById("grid");
      const subtitle = document.getElementById("subtitle");
      const lightbox = document.getElementById("lightbox");
      const lightboxImg = document.getElementById("lightboxImg");
      const lightboxVideo = document.getElementById("lightboxVideo");
      const counter = document.getElementById("counter");
      const shuffleBtn = document.getElementById("shuffleBtn");
      const filterBtn = document.getElementById("filterBtn");
      const filterIcon = document.getElementById("filterIcon");
      const pager = document.getElementById("pager");
      const pagePrev = document.getElementById("pagePrev");
      const pageNext = document.getElementById("pageNext");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const PAGE_SIZE = 86;
      // Everything gallery.json gave us, in its own order.
      let allItems = [];
      // The same items in a random order, regenerated whenever randomisation is
      // switched on — so changing the photo/video filter doesn't reshuffle.
      let shuffledItems = [];
      // What's actually on screen: the chosen order, then the chosen filter.
      let items = [];
      // `current` indexes the whole filtered gallery, not the visible page — the
      // lightbox walks straight across page boundaries.
      let current = 0;
      // Which page of thumbnails the grid is showing (0-based).
      let page = 0;
      let randomize = true;
      // Index into FILTERS below. Neither this nor `randomize` is persisted —
      // a reload puts both back to "random, everything".
      let filterIndex = 0;
      // Maps the id in the URL hash back to a gallery index, so a pasted link
      // opens straight onto that photo/video.
      const idToIndex = new Map();
      // True when opening the lightbox pushed a history entry we own, so closing
      // it can just go back. False when we landed directly on a shared link and
      // there's nothing of ours behind us.
      let pushedEntry = false;
      // Set while we're closing in response to back/forward, so the close handler
      // doesn't try to touch history again.
      let closingFromHistory = false;

      // Stable per-item id: the thumbnail/poster basename. They all live in one
      // directory so they're already unique, and unlike a positional index they
      // don't shift when new photos are added — old links keep working.
      function idFor(item) {
        const file = (item.type === "video" ? item.poster : item.thumb) || item.full;
        return file.split("/").pop().replace(/\.[^.]+$/, "");
      }

      function hashId() {
        return decodeURIComponent(location.hash.replace(/^#/, ""));
      }

      function urlFor(index) {
        return `${location.pathname}${location.search}#${encodeURIComponent(idFor(items[index]))}`;
      }

      function openLightbox(index) {
        current = index;
        showCurrent();
        if (!lightbox.open) {
          history.pushState({ lightbox: true }, "", urlFor(index));
          pushedEntry = true;
          lightbox.showModal();
        } else {
          history.replaceState({ lightbox: true }, "", urlFor(index));
        }
      }

      function showCurrent() {
        const p = items[current];
        if (p.type === "video") {
          lightboxVideo.src = p.full;
          lightboxVideo.poster = p.poster;
          lightboxImg.style.display = "none";
          lightboxVideo.style.display = "block";
          lightboxVideo.play().catch(() => {});
        } else {
          lightboxVideo.pause();
          lightboxVideo.removeAttribute("src");
          lightboxVideo.load();
          lightboxVideo.style.display = "none";
          lightboxImg.style.display = "block";
          lightboxImg.src = p.full;
          lightboxImg.alt = p.full;
        }
        counter.textContent = `${current + 1} / ${items.length}`;
        // No wrap-around: the ends of the gallery are dead ends.
        prevBtn.classList.toggle("is-hidden", current === 0);
        nextBtn.classList.toggle("is-hidden", current === items.length - 1);
      }

      function step(delta) {
        const next = current + delta;
        if (next < 0 || next >= items.length) return;
        current = next;
        showCurrent();
        // Keep the grid underneath in step, so escaping out of the lightbox
        // leaves you on the page holding the photo you were just looking at.
        showPageFor(current);
        // Replace rather than push: arrowing through 300 photos shouldn't bury
        // the Back button under 300 history entries.
        history.replaceState({ lightbox: true }, "", urlFor(current));
      }

      // Switch the grid to the page containing a given gallery index.
      function showPageFor(index) {
        const wanted = Math.floor(index / PAGE_SIZE);
        if (wanted === page) return;
        page = wanted;
        renderGrid();
      }

      function closeLightbox() {
        lightbox.close();
      }

      // All teardown lives here so the native Escape-closes-a-<dialog> path gets
      // the same cleanup as our own close button.
      // On the way out of the lightbox, bring the thumbnail you were just
      // looking at into view — after paging around, wherever the grid happens
      // to be scrolled is rarely where that photo is.
      function scrollCurrentIntoView() {
        const tile = grid.children[current - page * PAGE_SIZE];
        if (tile) tile.scrollIntoView({ block: "center" });
      }

      lightbox.addEventListener("close", () => {
        lightboxVideo.pause();
        scrollCurrentIntoView();
        if (closingFromHistory) {
          closingFromHistory = false;
          return;
        }
        if (pushedEntry) {
          pushedEntry = false;
          history.back();
        } else if (location.hash) {
          history.replaceState(null, "", location.pathname + location.search);
        }
      });

      // Back/forward, and pasting a different link into the address bar of an
      // already-open tab (that fires hashchange, not a reload).
      function syncFromUrl() {
        const index = idToIndex.get(hashId());
        if (index !== undefined) {
          current = index;
          showCurrent();
          showPageFor(current);
          if (!lightbox.open) lightbox.showModal();
          return;
        }
        pushedEntry = false;
        if (lightbox.open) {
          closingFromHistory = true;
          lightbox.close();
        }
      }

      window.addEventListener("popstate", syncFromUrl);
      window.addEventListener("hashchange", syncFromUrl);

      document.getElementById("closeBtn").addEventListener("click", closeLightbox);
      prevBtn.addEventListener("click", () => step(-1));
      nextBtn.addEventListener("click", () => step(1));

      lightbox.addEventListener("click", (e) => {
        // Click on the backdrop (the dialog element itself, not its content) closes it.
        if (e.target === lightbox) closeLightbox();
      });

      document.addEventListener("keydown", (e) => {
        if (!lightbox.open) return;
        if (e.key === "Escape") closeLightbox();
        if (e.key === "ArrowLeft") step(-1);
        if (e.key === "ArrowRight") step(1);
      });

      function buildPhotoTile(p, btn) {
        const img = document.createElement("img");
        img.src = p.thumb;
        img.alt = "";
        img.loading = "lazy";
        img.decoding = "async";
        btn.appendChild(img);
      }
      
      // Returns a shuffled copy, so the gallery's own order stays available for
      // when randomisation is switched back off.
      function shuffle(array) {
        const out = array.slice();
        let currentIndex = out.length;

        // While there remain elements to shuffle...
        while (currentIndex != 0) {

          // Pick a remaining element...
          let randomIndex = Math.floor(Math.random() * currentIndex);
          currentIndex--;

          // And swap it with the current element.
          [out[currentIndex], out[randomIndex]] = [out[randomIndex], out[currentIndex]];
        }
        return out;
      }

      function buildVideoTile(p, btn) {
        const img = document.createElement("img");
        img.src = p.poster;
        img.alt = "";
        img.loading = "lazy";
        img.decoding = "async";
        btn.appendChild(img);

        const badge = document.createElement("span");
        badge.className = "play-badge";
        btn.appendChild(badge);

        // The hover-preview <video> is only created on first hover, so a page with
        // many videos doesn't kick off dozens of network requests on load.
        let video = null;
        let leaveTimer = null;

        btn.addEventListener("mouseenter", () => {
          clearTimeout(leaveTimer);
          if (!video) {
            video = document.createElement("video");
            video.className = "preview";
            video.src = p.preview;
            video.muted = true;
            video.loop = true;
            video.playsInline = true;
            btn.appendChild(video);
          }
          btn.classList.add("video-hovering");
          video.currentTime = 0;
          video.play().catch(() => {});
        });

        btn.addEventListener("mouseleave", () => {
          btn.classList.remove("video-hovering");
          // Give the fade-out transition a moment before pausing.
          leaveTimer = setTimeout(() => video && video.pause(), 150);
        });
      }

      // Icons are inline so the page stays a single file with no extra requests.
      const FILTERS = [
        {
          label: "Showing photos and videos",
          tip: "Showing photos and videos — click for photos only",
          keep: () => true,
          icon: `<path d="M18 22H4a2 2 0 0 1-2-2V6" /><rect x="6" y="2" width="16" height="16" rx="2" />
                 <circle cx="11" cy="8" r="1.6" /><path d="m22 12-3.3-3.3a2 2 0 0 0-2.8 0L10 15" />`,
        },
        {
          label: "Showing photos only",
          tip: "Showing photos only — click for videos only",
          keep: (p) => p.type !== "video",
          icon: `<rect x="3" y="3" width="18" height="18" rx="2" /><circle cx="9" cy="9" r="1.8" />
                 <path d="m21 15-4.6-4.6a2 2 0 0 0-2.8 0L3.5 20.5" />`,
        },
        {
          label: "Showing videos only",
          tip: "Showing videos only — click to show both",
          keep: (p) => p.type === "video",
          icon: `<path d="m22 8-6 4 6 4V8Z" /><rect x="2" y="6" width="14" height="12" rx="2" />`,
        },
      ];

      // aria-label states what the control currently is; data-tip (the hover
      // bubble) also says what clicking will do next.
      function syncControls() {
        shuffleBtn.classList.toggle("on", randomize);
        shuffleBtn.setAttribute("aria-pressed", String(randomize));
        shuffleBtn.setAttribute("aria-label", randomize ? "Random order (on)" : "Random order (off)");
        shuffleBtn.dataset.tip = randomize
          ? "Random order — click for gallery order"
          : "Gallery order — click to shuffle";

        const filter = FILTERS[filterIndex];
        filterIcon.innerHTML = filter.icon;
        filterBtn.classList.toggle("on", filterIndex !== 0);
        filterBtn.setAttribute("aria-label", filter.label);
        filterBtn.dataset.tip = filter.tip;
      }

      function pageCount() {
        return Math.max(1, Math.ceil(items.length / PAGE_SIZE));
      }

      // Draws one page of thumbnails plus the pager beneath it. Never touches
      // the lightbox — `current` is a gallery-wide index and is independent of
      // which page happens to be on screen.
      function renderGrid() {
        const start = page * PAGE_SIZE;
        const shown = items.slice(start, start + PAGE_SIZE);

        grid.innerHTML = "";
        shown.forEach((p, i) => {
          const index = start + i;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.setAttribute("aria-label", `Open ${p.type === "video" ? "video" : "photo"} ${index + 1}`);
          btn.addEventListener("click", () => openLightbox(index));

          if (p.type === "video") {
            buildVideoTile(p, btn);
          } else {
            buildPhotoTile(p, btn);
          }

          grid.appendChild(btn);
        });

        const pages = pageCount();
        pager.hidden = pages < 2;
        pagePrev.disabled = page === 0;
        pageNext.disabled = page >= pages - 1;
      }

      function goToPage(next) {
        const clamped = Math.min(Math.max(next, 0), pageCount() - 1);
        if (clamped === page) return;
        page = clamped;
        renderGrid();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function render() {
        // Hold onto whatever the lightbox is showing so a reorder or a filter
        // change doesn't yank it out from under the viewer.
        const openId = lightbox.open && items.length ? idFor(items[current]) : null;

        const base = randomize ? shuffledItems : allItems;
        items = base.filter(FILTERS[filterIndex].keep);
        idToIndex.clear();
        items.forEach((p, i) => idToIndex.set(idFor(p), i));

        syncControls();

        if (items.length === 0) {
          subtitle.textContent = allItems.length ? "Nothing matches that filter." : "Nothing here yet.";
          grid.innerHTML = '<p class="empty">Check back soon.</p>';
          pager.hidden = true;
          if (lightbox.open) closeLightbox();
          return;
        }

        const photoCount = items.filter((p) => p.type !== "video").length;
        const videoCount = items.length - photoCount;
        const parts = [];
        if (photoCount) parts.push(`${photoCount} photo${photoCount === 1 ? "" : "s"}`);
        if (videoCount) parts.push(`${videoCount} video${videoCount === 1 ? "" : "s"}`);
        subtitle.textContent = parts.join(", ") + ", 2 best dogs ever";

        // A reorder or filter change reshuffles what lives on which page, so
        // start from the top unless the lightbox anchors us somewhere.
        const stillShown = openId === null ? undefined : idToIndex.get(openId);
        current = stillShown === undefined ? 0 : stillShown;
        page = Math.floor(current / PAGE_SIZE);
        renderGrid();

        if (openId !== null) {
          if (stillShown === undefined) {
            // Filtered away — close rather than jump to some unrelated item.
            closeLightbox();
          } else {
            showCurrent();
            history.replaceState({ lightbox: true }, "", urlFor(current));
          }
        }
      }

      shuffleBtn.addEventListener("click", () => {
        randomize = !randomize;
        // Deal a fresh order each time it's turned on.
        if (randomize) shuffledItems = shuffle(allItems);
        render();
      });

      filterBtn.addEventListener("click", () => {
        filterIndex = (filterIndex + 1) % FILTERS.length;
        render();
      });

      pagePrev.addEventListener("click", () => goToPage(page - 1));
      pageNext.addEventListener("click", () => goToPage(page + 1));

      // Draw the icons before the gallery lands (and if it never does).
      syncControls();

      fetch("gallery.json")
        .then((r) => r.json())
        .then((data) => {
          allItems = data;
          shuffledItems = shuffle(allItems);
          render();

          // Arrived on a shared link: open that item immediately. No pushState —
          // there's no page-of-ours behind us to go back to, so closing strips
          // the hash instead.
          const deepLink = idToIndex.get(hashId());
          if (deepLink !== undefined) {
            current = deepLink;
            showCurrent();
            // So closing the shared link drops you on that photo's page.
            showPageFor(current);
            lightbox.showModal();
          }
        })
        .catch((err) => {
          console.error(err);
          subtitle.textContent = "Couldn't load the gallery.";
        });
    </script>
  </body>
